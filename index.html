<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados de la Rifa</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#111827,#312e81);
  color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px;
}
.card{
  width:min(520px,100%); background:rgba(255,255,255,.10);
  backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.16);
  border-radius:28px; padding:32px 24px; text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.badge{display:inline-block;background:#fff;color:#312e81;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px}
h1{font-size:34px;margin:18px 0 8px}
.date{opacity:.75;margin-bottom:28px}
.prize{
  background:rgba(255,255,255,.12); border-radius:18px; padding:18px;
  margin:12px 0; display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.prize .name{text-align:left;font-weight:700}
.number{font-size:30px;font-weight:900;letter-spacing:2px}
.footer{margin-top:28px;opacity:.65;font-size:13px}

.video-sorteo{
  margin-top:28px;
  text-align:center;
}
.video-sorteo h2{
  font-size:22px;
  margin:0 0 10px;
}
.video-sorteo p{
  opacity:.8;
  font-size:14px;
  line-height:1.5;
  margin:0 0 16px;
}
.video-container{
  position:relative;
  width:100%;
  aspect-ratio:16 / 9;
  overflow:hidden;
  border-radius:16px;
  background:#000;
}
.video-container iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
}

</style>
</head>
<body>
<main class="card">
  <span class="badge">🎟️ RESULTADOS</span>
  <h1>Rifa</h1>
  <div class="date">Sorteo: <strong>15/10/2026</strong></div>

  <!-- CAMBIÁ LOS NÚMEROS DE ABAJO CUANDO HAGAS EL SORTEO -->
  <section class="prize">
    <div class="name">🥇 1.º premio</div>
    <div class="number">058</div>
  </section>
  <section class="prize">
    <div class="name">🥈 2.º premio</div>
    <div class="number">089</div>
  </section>
  <section class="prize">
    <div class="name">🥉 3.º premio</div>
    <div class="number">026</div>
  </section>


  <section class="video-sorteo">
    <h2>🎥 Video del sorteo</h2>
    <p>Mirá la grabación del sorteo y cómo se extrajeron los números ganadores.</p>
    <div class="video-container">
      <iframe
        src="https://www.youtube-nocookie.com/embed/W8vcIiBlgD0"
        title="Video del sorteo de la rifa"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <div class="footer">¡Gracias por participar!</div>
</main>
</body>
</html>
